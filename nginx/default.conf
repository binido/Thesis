upstream libertypost {
    server web:8000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name binido.online www.binido.online;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name binido.online www.binido.online;
    client_max_body_size 100M;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/binido.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/binido.online/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location /static/ {
        alias /app/libertypost/staticfiles/;
        autoindex on;
        access_log off;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    location /static/admin/ {
        alias /app/libertypost/staticfiles/admin/;
        access_log off;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/libertypost/media/;
        access_log off;
        expires max;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://libertypost;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
